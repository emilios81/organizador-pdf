<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; width: 100%; overflow: hidden; }

body {
  font-family: 'Roboto', sans-serif;
  background: #080b11;
  color: #dce2ee;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

/* Deep ambient background */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 70% 55% at 20% 8%,  rgba(199,154,67,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 80% 85%, rgba(120,100,200,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 40% 60% at 60% 40%, rgba(20,35,65,0.5)    0%, transparent 65%),
    linear-gradient(160deg, #0b0f1c 0%, #070a12 55%, #0c0910 100%);
  pointer-events: none;
}
#root { position: relative; z-index: 1; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(199,154,67,0.18); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(199,154,67,0.32); }

/* ── Liquid glass surfaces ── */
.gl-top {
  background: rgba(255,255,255,0.028);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border-bottom: 0.5px solid rgba(255,255,255,0.06);
  box-shadow: 0 1px 0 rgba(255,255,255,0.03), 0 8px 32px rgba(0,0,0,0.28);
}
.gl-panel {
  background: rgba(255,255,255,0.022);
  backdrop-filter: blur(24px) saturate(150%);
  -webkit-backdrop-filter: blur(24px) saturate(150%);
}
.gl-item {
  background: rgba(255,255,255,0.028);
  border: 0.5px solid rgba(255,255,255,0.065);
  border-radius: 9px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.055), 0 2px 10px rgba(0,0,0,0.22);
  transition: background 0.18s, border-color 0.18s, box-shadow 0.18s;
}
.gl-item:hover {
  background: rgba(255,255,255,0.042);
  border-color: rgba(255,255,255,0.1);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 18px rgba(0,0,0,0.28);
}
.gl-item.sel {
  background: rgba(199,154,67,0.065);
  border-color: rgba(199,154,67,0.22);
  box-shadow: inset 0 1px 0 rgba(199,154,67,0.12), 0 0 0 1px rgba(199,154,67,0.07), 0 4px 18px rgba(0,0,0,0.3);
}

/* ── Gold primary button ── */
.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(145deg, rgba(210,168,72,0.88), rgba(195,148,58,0.82));
  border: 0.5px solid rgba(230,192,100,0.35);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 2px 14px rgba(199,154,67,0.22), 0 1px 4px rgba(0,0,0,0.35);
  color: rgba(20,14,0,0.9);
  font-family: 'Roboto', sans-serif;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.03em;
  border-radius: 8px; padding: 7px 15px;
  cursor: pointer; transition: all 0.18s;
}
.btn-primary:hover {
  background: linear-gradient(145deg, rgba(222,180,82,0.94), rgba(207,160,66,0.88));
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 4px 22px rgba(199,154,67,0.32), 0 2px 6px rgba(0,0,0,0.32);
  transform: translateY(-0.5px);
}
.btn-primary:active { transform: translateY(0); }

/* ── Ghost button ── */
.btn-ghost {
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,0.038);
  border: 0.5px solid rgba(255,255,255,0.075);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.045);
  color: rgba(195,205,228,0.65);
  font-family: 'Roboto', sans-serif;
  font-size: 12px; font-weight: 400;
  letter-spacing: 0.02em;
  border-radius: 8px; padding: 6px 14px;
  cursor: pointer; transition: all 0.18s;
}
.btn-ghost:hover {
  background: rgba(255,255,255,0.062);
  border-color: rgba(255,255,255,0.115);
  color: rgba(215,224,244,0.88);
}
.btn-ghost:disabled { opacity: 0.32; cursor: default; }
.btn-ghost.danger:hover { color: rgba(210,80,80,0.85); border-color: rgba(210,80,80,0.2); }

/* ── Save button on file item ── */
.btn-save {
  background: rgba(199,154,67,0.1);
  border: 0.5px solid rgba(199,154,67,0.28);
  color: rgba(210,168,80,0.88);
  font-family: 'Roboto', sans-serif;
  font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.05em;
  border-radius: 5px; padding: 4px 11px;
  cursor: pointer; transition: all 0.18s;
  flex-shrink: 0; white-space: nowrap;
}
.btn-save:hover {
  background: rgba(199,154,67,0.2);
  border-color: rgba(199,154,67,0.46);
  box-shadow: 0 0 14px rgba(199,154,67,0.14);
}

/* ── Source badge ── */
.src-badge {
  font-family: 'Roboto Mono', monospace;
  font-size: 8.5px; font-weight: 400;
  padding: 1.5px 5px; border-radius: 3px;
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(255,255,255,0.08);
  color: rgba(180,192,218,0.4);
  flex-shrink: 0; letter-spacing: 0.025em;
}

/* ── Dividers ── */
.div-h {
  width: 1px; flex-shrink: 0;
  background: rgba(255,255,255,0.042);
  cursor: col-resize; position: relative;
  transition: background 0.2s;
}
.div-h::after { content:''; position:absolute; top:0; bottom:0; left:-4px; right:-4px; }
.div-h:hover, .div-h.active { background: rgba(199,154,67,0.38); box-shadow: 0 0 8px rgba(199,154,67,0.18); }

.div-v {
  height: 1px; flex-shrink: 0;
  background: rgba(255,255,255,0.04);
  cursor: row-resize; position: relative;
  transition: background 0.2s;
}
.div-v::after { content:''; position:absolute; left:0; right:0; top:-4px; bottom:-4px; }
.div-v:hover, .div-v.active { background: rgba(199,154,67,0.3); }

/* ── Tabs ── */
.tab {
  background: transparent; border: none;
  color: rgba(175,188,215,0.42);
  font-family: 'Roboto', sans-serif;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.07em; text-transform: uppercase;
  padding: 4px 11px; border-radius: 5px;
  cursor: pointer; transition: all 0.15s;
}
.tab.on {
  background: rgba(255,255,255,0.055);
  border: 0.5px solid rgba(255,255,255,0.08);
  color: rgba(218,226,244,0.88);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07);
}

/* ── File input ── */
.finput {
  background: transparent; border: none;
  border-bottom: 1px solid transparent;
  color: rgba(218,226,244,0.88);
  font-family: 'Roboto', sans-serif;
  font-size: 12.5px; font-weight: 400;
  padding: 3px 0; outline: none;
  flex: 1; min-width: 0;
  transition: border-color 0.18s;
}
.finput:focus { border-bottom-color: rgba(199,154,67,0.38); }
.finput.done { opacity: 0.48; }

/* ── Page nav ── */
.pg-btn {
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(255,255,255,0.07);
  color: rgba(175,188,215,0.55);
  border-radius: 5px; padding: 3px 9px;
  cursor: pointer; font-size: 13px;
  font-family: 'Roboto', sans-serif;
  transition: all 0.15s; line-height: 1;
}
.pg-btn:hover { background: rgba(255,255,255,0.08); color: rgba(210,220,244,0.88); }

/* ── Zoom pill ── */
.zoom-pill {
  position: absolute;
  bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center;
  background: rgba(18,22,36,0.72);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  border: 0.5px solid rgba(255,255,255,0.12);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.1),
    inset 0 -1px 0 rgba(0,0,0,0.25),
    0 4px 20px rgba(0,0,0,0.5),
    0 1px 4px rgba(0,0,0,0.4);
  border-radius: 999px;
  overflow: hidden;
  transition: width 0.38s cubic-bezier(0.34,1.3,0.64,1),
              padding 0.32s cubic-bezier(0.34,1.3,0.64,1),
              opacity 0.22s ease;
  white-space: nowrap;
  z-index: 10;
}
.zoom-pill.collapsed {
  width: 36px; height: 36px;
  padding: 0;
  justify-content: center;
}
.zoom-pill.expanded {
  width: 152px; height: 36px;
  padding: 0 6px;
  justify-content: space-between;
  gap: 0;
}
.zpill-btn {
  background: transparent; border: none;
  color: rgba(210,220,244,0.75);
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: 999px;
  font-size: 16px; line-height: 1;
  transition: background 0.15s, color 0.15s, transform 0.15s;
  flex-shrink: 0;
}
.zpill-btn:hover { background: rgba(255,255,255,0.1); color: rgba(230,238,255,0.95); }
.zpill-btn:active { transform: scale(0.88); }
.zpill-btn.active-mode { color: rgba(199,154,67,0.95); background: rgba(199,154,67,0.12); }
.zpill-sep { width: 0.5px; height: 18px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
.zoom-pct {
  font-size: 10px; font-weight: 500; font-variant-numeric: tabular-nums;
  color: rgba(175,188,218,0.55); letter-spacing: 0.03em;
  min-width: 34px; text-align: center; pointer-events: none;
}

/* ── Console ── */
.console-wrap {
  font-family: 'Roboto Mono', monospace;
  font-size: 11px; line-height: 1.65;
  padding: 7px 14px; overflow-y: auto; flex: 1;
}
.l-ok  { color: rgba(72,195,130,0.75); }
.l-inf { color: rgba(145,160,195,0.6); }
.l-err { color: rgba(215,85,85,0.75); }

/* ── PDF mock ── */
.pdf-wrap {
  width: 100%; aspect-ratio: 0.707;
  background: #f3ede4;
  border-radius: 5px; overflow: hidden;
  box-shadow: 0 6px 30px rgba(0,0,0,0.55), 0 1px 5px rgba(0,0,0,0.35);
}
.pdf-empty {
  width: 100%; aspect-ratio: 0.707;
  background: rgba(255,255,255,0.018);
  border: 0.5px solid rgba(255,255,255,0.055);
  border-radius: 5px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
}

/* ── Status bar ── */
.sbar {
  height: 22px; flex-shrink: 0;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 0.5px solid rgba(255,255,255,0.04);
  display: flex; align-items: center;
  padding: 0 14px; gap: 12px;
}
.sbar-txt { font-size: 10px; color: rgba(140,155,190,0.42); letter-spacing: 0.02em; }
.sbar-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(72,195,130,0.45); box-shadow: 0 0 6px rgba(72,195,130,0.35); flex-shrink: 0; }

/* ── Micro label ── */
.mlabel {
  font-size: 9.5px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(165,178,210,0.28);
}

/* ── Saved chip ── */
.saved-chip { font-size: 9.5px; font-weight: 500; letter-spacing: 0.06em; color: rgba(72,195,130,0.58); flex-shrink: 0; }

/* ── Remove btn ── */
.rm-btn {
  background: transparent; border: none;
  color: rgba(175,188,215,0.22);
  cursor: pointer; font-size: 15px; line-height: 1;
  padding: 2px 4px; border-radius: 3px; transition: color 0.15s; flex-shrink: 0;
}
.rm-btn:hover { color: rgba(210,75,75,0.7); }

/* ── Param bar ── */
.pbar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 0 18px; height: 100%;
}
.ptag { font-size: 11.5px; font-weight: 400; color: rgba(199,154,67,0.65); letter-spacing: 0.015em; }
.parr { color: rgba(255,255,255,0.14); font-size: 10px; }

/* ── Gold accent line ── */
.gline {
  height: 1px; flex-shrink: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(199,154,67,0.18) 25%, rgba(199,154,67,0.18) 75%, transparent 100%);
}

/* ── Textarea ── */
.txtarea {
  flex: 1; resize: none; outline: none;
  background: rgba(0,0,0,0.18);
  border: 0.5px solid rgba(255,255,255,0.055);
  border-radius: 6px;
  color: rgba(165,180,212,0.72);
  font-family: 'Roboto Mono', monospace;
  font-size: 10.5px; line-height: 1.72;
  padding: 10px 12px;
  transition: border-color 0.2s;
}
.txtarea:focus { border-color: rgba(199,154,67,0.22); }

/* ── Loading animation ── */
@keyframes spin-slow {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes spin-rev {
  from { transform: rotate(0deg); }
  to   { transform: rotate(-360deg); }
}
@keyframes breathe {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50%       { opacity: 1;   transform: scale(1.06); }
}
@keyframes fade-up {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
@keyframes overlay-in {
  from { opacity: 0; backdrop-filter: blur(0px); }
  to   { opacity: 1; backdrop-filter: blur(32px); }
}
@keyframes modal-in {
  from { opacity: 0; transform: translateY(18px) scale(0.95); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
@keyframes dash-rotate {
  to { stroke-dashoffset: -126; }
}
@keyframes file-row-in {
  from { opacity: 0; transform: translateX(-10px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position:  200% center; }
}
@keyframes tick-pop {
  0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
  60%  { transform: scale(1.25) rotate(5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.loading-overlay {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  background: rgba(6,9,18,0.65);
  animation: overlay-in 0.35s ease forwards;
  backdrop-filter: blur(18px) saturate(120%);
  -webkit-backdrop-filter: blur(18px) saturate(120%);
}
.loading-modal {
  width: 340px;
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 32px 28px 28px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.1),
    0 8px 40px rgba(0,0,0,0.6),
    0 2px 8px rgba(0,0,0,0.4);
  animation: modal-in 0.45s cubic-bezier(0.34,1.3,0.64,1) forwards;
}
.spinner-ring {
  animation: spin-slow 2.8s linear infinite;
  transform-origin: center;
}
.spinner-ring-rev {
  animation: spin-rev 4s linear infinite;
  transform-origin: center;
}
.spinner-dash {
  stroke-dasharray: 42 84;
  animation: dash-rotate 1.4s cubic-bezier(0.6,0,0.4,1) infinite;
}
.breathe-dot {
  animation: breathe 1.8s ease-in-out infinite;
  transform-origin: center;
}
.file-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  border-bottom: 0.5px solid rgba(255,255,255,0.04);
  animation: file-row-in 0.4s cubic-bezier(0.34,1.2,0.64,1) both;
}
.file-row:last-child { border-bottom: none; }
.shimmer-text {
  background: linear-gradient(
    90deg,
    rgba(180,192,225,0.4) 0%,
    rgba(199,154,67,0.8)  40%,
    rgba(180,192,225,0.4) 80%
  );
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 1.6s linear infinite;
}
.tick-appear {
  animation: tick-pop 0.35s cubic-bezier(0.34,1.4,0.64,1) both;
}
</style>
</head>

/* ── Loading overlay ── */
function LoadingOverlay({ files, onDone }) {
  const [revealed, setRevealed] = useState([]);   // indices shown so far
  const [ticked,   setTicked]   = useState([]);   // indices with ✓
  const [phase,    setPhase]    = useState('spin'); // 'spin' | 'files' | 'done'

  useEffect(() => {
    // Phase 1: show spinner 700ms
    const t1 = setTimeout(() => setPhase('files'), 700);
    return () => clearTimeout(t1);
  }, []);

  useEffect(() => {
    if (phase !== 'files') return;
    // Reveal each file row with stagger
    files.forEach((_, i) => {
      const tShow = setTimeout(() => setRevealed(p => [...p, i]), i * 420);
      const tTick = setTimeout(() => setTicked(p => [...p, i]),   i * 420 + 520);
    });
    // After all done, wait then close
    const tDone = setTimeout(() => setPhase('done'), files.length * 420 + 900);
    const tClose= setTimeout(() => onDone(),         files.length * 420 + 1200);
    return () => { /* cleanup handled by onDone */ };
  }, [phase]);

  const pct = phase === 'spin' ? 0
    : phase === 'done' ? 100
    : Math.round((ticked.length / files.length) * 100);

  return (
    <div className="loading-overlay" onClick={e => e.stopPropagation()}>
      <div className="loading-modal">

        {/* Spinner + title */}
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:18, marginBottom: phase === 'files' ? 24 : 0 }}>

            <div style={{ fontSize:13, fontWeight:500, color:'rgba(218,228,248,0.82)', marginBottom:4, letterSpacing:'0.01em' }}>

            <div style={{ fontSize:11, color:'rgba(145,158,195,0.45)', fontWeight:300 }}>

function PDFViewer({ file }) {
  const [zoom, setZoom]       = useState(1);
  const [mode, setMode]       = useState('select'); // 'select' | 'pan'
  const [offset, setOffset]   = useState({ x: 0, y: 0 });
  const [pillOpen, setPillOpen] = useState(false);
  const [dragging, setDragging] = useState(false);
  const dragStart = useRef(null);
  const wrapRef   = useRef(null);
  const pillTimer = useRef(null);

  // open pill on hover, close after short delay when mouse leaves
  const openPill  = () => { clearTimeout(pillTimer.current); setPillOpen(true); };
  const closePill = () => { pillTimer.current = setTimeout(() => setPillOpen(false), 900); };

  const clamp = (val, mn, mx) => Math.min(mx, Math.max(mn, val));

  const doZoom = (delta) => {
    setZoom(z => clamp(+(z + delta).toFixed(2), 0.4, 3));
  };

  // pan handlers
  const onMouseDown = (e) => {
    if (mode !== 'pan') return;
    e.preventDefault();
    dragStart.current = { x: e.clientX - offset.x, y: e.clientY - offset.y };
    setDragging(true);
  };
  const onMouseMove = (e) => {
    if (!dragging || !dragStart.current) return;
    setOffset({ x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y });
  };
  const onMouseUp = () => { setDragging(false); dragStart.current = null; };

  // wheel zoom
  const onWheel = (e) => {
    e.preventDefault();
    doZoom(e.deltaY < 0 ? 0.1 : -0.1);
  };

  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  });

  // reset on file change
  useEffect(() => { setZoom(1); setOffset({ x:0, y:0 }); setMode('select'); }, [file?.id]);

  if (!file) return (
    <div className="pdf-empty">
      <svg width="26" height="34" viewBox="0 0 26 34" fill="none">
        <rect x="1" y="1" width="24" height="32" rx="2" stroke="rgba(175,188,218,0.16)" strokeWidth="1.1"/>
        <path d="M6 11h14M6 16h14M6 21h9" stroke="rgba(175,188,218,0.16)" strokeWidth="0.9" strokeLinecap="round"/>
        <path d="M17 1v9h8" stroke="rgba(175,188,218,0.16)" strokeWidth="1.1"/>
      </svg>
      <div style={{ fontSize:10.5, fontWeight:300, color:'rgba(150,165,200,0.22)', textAlign:'center', lineHeight:1.65 }}>
        Sube un PDF<br/>para ver la<br/>vista previa
      </div>
    </div>
  );

  const pct = Math.round(zoom * 100);

  return (
    <div
      ref={wrapRef}
      onMouseEnter={openPill}
      onMouseLeave={closePill}
      onMouseDown={onMouseDown}
      onMouseMove={onMouseMove}
      onMouseUp={onMouseUp}
      style={{
        position: 'relative',
        width: '100%',
        aspectRatio: '0.707',
        overflow: 'hidden',
        borderRadius: 6,
        background: 'rgba(255,255,255,0.018)',
        border: '0.5px solid rgba(255,255,255,0.06)',
        cursor: mode === 'pan' ? (dragging ? 'grabbing' : 'grab') : 'default',
        userSelect: 'none',
      }}
    >
      {/* PDF page with zoom + pan + relief */}
      <div style={{
        position: 'absolute',
        top: '50%', left: '50%',
        transform: `translate(calc(-50% + ${offset.x}px), calc(-50% + ${offset.y}px)) scale(${zoom})`,
        transformOrigin: 'center center',
        transition: dragging ? 'none' : 'transform 0.06s ease-out',
        width: '88%',
        borderRadius: 4,
        overflow: 'hidden',
        /* Relief / depth on paper */
        boxShadow: `
          0 0 0 0.5px rgba(180,165,140,0.35),
          0 2px 8px rgba(0,0,0,0.4),
          0 8px 28px rgba(0,0,0,0.55),
          0 16px 48px rgba(0,0,0,0.35),
          inset 0 1px 0 rgba(255,255,255,0.55),
          inset 1px 0 0 rgba(255,255,255,0.12),
          inset -1px 0 0 rgba(0,0,0,0.08)
        `,
      }}>
        {/* paper texture overlay */}
        <div style={{
          position: 'absolute', inset: 0, zIndex: 2, pointerEvents: 'none',
          background: `
            linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 6%, transparent 94%, rgba(0,0,0,0.06) 100%),
            linear-gradient(90deg, rgba(255,255,255,0.08) 0%, transparent 4%, transparent 96%, rgba(0,0,0,0.04) 100%)
          `,
          borderRadius: 4,
        }} />
        <div style={{ background: '#f3ede4', borderRadius: 4 }}>
          <PDFPage ti={file.ti} />
        </div>
      </div>

      {/* Animated pill toolbar */}
      <div
        className={`zoom-pill ${pillOpen ? 'expanded' : 'collapsed'}`}
        onMouseEnter={openPill}
        onMouseLeave={closePill}
      >
        {pillOpen ? (
          <>
            {/* Zoom out */}
            <button className="zpill-btn" onClick={() => doZoom(-0.15)} title="Alejar">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="6" cy="6" r="4.5" stroke="currentColor" strokeWidth="1.2"/>
                <path d="M4 6h4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                <path d="M9.5 9.5L12.5 12.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
              </svg>
            </button>

            {/* % label */}
            <span className="zoom-pct">{pct}%</span>

            <div className="zpill-sep" />

            {/* Zoom in */}
            <button className="zpill-btn" onClick={() => doZoom(0.15)} title="Acercar">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="6" cy="6" r="4.5" stroke="currentColor" strokeWidth="1.2"/>
                <path d="M4 6h4M6 4v4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                <path d="M9.5 9.5L12.5 12.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
              </svg>
            </button>

            <div className="zpill-sep" />

            {/* Pan / hand tool */}
            <button
              className={`zpill-btn${mode === 'pan' ? ' active-mode' : ''}`}
              onClick={() => setMode(m => m === 'pan' ? 'select' : 'pan')}
              title="Mover"
            >
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                <path d="M6 2.5V8M6 2.5C6 1.67 6.67 1 7.5 1S9 1.67 9 2.5V7M6 2.5C6 1.67 5.33 1 4.5 1S3 1.67 3 2.5V8.5M9 7C9 6.17 9.67 5.5 10.5 5.5S12 6.17 12 7V9.5C12 11.43 10.43 13 8.5 13H7C5.34 13 3.92 11.92 3.3 10.42L2 7.5C1.73 6.84 2.05 6.08 2.72 5.84C3.36 5.61 4.06 5.92 4.32 6.54L4.5 7" stroke="currentColor" strokeWidth="1.1" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </>
        ) : (
          /* Collapsed — show only the hand/zoom icon */
          <button className="zpill-btn" style={{ width:36, height:36 }}
            onClick={openPill} title="Herramientas de zoom">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
              <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" strokeWidth="1.2"/>
              <path d="M4.5 6.5h4M6.5 4.5v4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
              <path d="M10 10L13 13" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
            </svg>
          </button>
        )}
      </div>
    </div>
  );
}

          <div style={{ display:'flex', gap:6, alignItems:'center' }}>
            <span style={{ fontSize:11, color:'rgba(199,154,67,0.72)', fontWeight:400 }}>{total} analizados</span>
            <span style={{ color:'rgba(255,255,255,0.12)', fontSize:12 }}>·</span>
            <span style={{ fontSize:11, color:'rgba(72,195,130,0.68)', fontWeight:400 }}>{saved} guardados</span>
          </div>
        )}
      </div>

      {/* gold accent line */}
      <div className="gline" />

      {/* PARAM BAR */}
      <div style={{ height:PARAM_H, flexShrink:0, borderBottom:'0.5px solid rgba(255,255,255,0.035)' }}>
        <div className="pbar">
          {PARAMS.map((p,i) => (
            <React.Fragment key={i}>
              <span className="ptag">{p}</span>
              {i < PARAMS.length-1 && <span className="parr">→</span>}
            </React.Fragment>
          ))}
        </div>
      </div>

      {/* MAIN */}
      <div ref={cRef} style={{ flex:1, display:'flex', minHeight:0, overflow:'hidden' }}>

        {/* LEFT: queue */}
        <div style={{ width:`${leftPct}%`, minWidth:200, display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <div style={{ padding:'7px 14px 4px', borderBottom:'0.5px solid rgba(255,255,255,0.035)', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
            <span className="mlabel">Cola</span>
            {hasFiles && <span style={{ fontSize:9.5, color:'rgba(145,158,195,0.28)' }}>{total} archivo{total!==1?'s':''}</span>}
          </div>
          {hasFiles && (
            <div style={{ padding:'3px 14px 4px', borderBottom:'0.5px solid rgba(255,255,255,0.025)', flexShrink:0 }}>
              <span style={{ fontSize:9, color:'rgba(145,158,195,0.22)', fontWeight:300, letterSpacing:'0.02em' }}>Nombre sugerido para renombrar</span>
            </div>
          )}
          <div style={{ flex:1, overflowY:'auto', padding: hasFiles ? '10px 12px' : 0 }}>
            {!hasFiles ? (
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'100%', gap:14, color:'rgba(145,158,195,0.22)' }}>
                <svg width="38" height="46" viewBox="0 0 38 46" fill="none">
                  <rect x="1.5" y="1.5" width="35" height="43" rx="3" stroke="rgba(175,188,218,0.13)" strokeWidth="1.2"/>
                  <path d="M9 15h20M9 21h20M9 27h13" stroke="rgba(175,188,218,0.13)" strokeWidth="1" strokeLinecap="round"/>
                  <path d="M25 1.5v11h11" stroke="rgba(175,188,218,0.13)" strokeWidth="1.2"/>
                </svg>
                <div style={{ textAlign:'center', lineHeight:1.85 }}>
                  <div style={{ fontSize:12.5, fontWeight:400, color:'rgba(180,192,228,0.28)' }}>La cola está vacía.</div>
                  <div style={{ fontSize:11, fontWeight:300, color:'rgba(145,158,195,0.2)' }}>
                    Haz clic en <span style={{ color:'rgba(199,154,67,0.48)', fontWeight:500 }}>Subir PDFs</span> para empezar.
                  </div>
                </div>
              </div>
            ) : files.map(f => (
              <FileItem key={f.id} f={f} sel={f.id===selId}
                onSel={pick} onSave={save} onRm={remove} onChange={change}
              />
            ))}
          </div>
        </div>

        {/* H divider */}
        <div className="div-h" onMouseDown={() => { dragH.current = true; }} />

        {/* RIGHT PANEL */}
        <div style={{ width:rightW, minWidth:155, flexShrink:0, display:'flex', flexDirection:'column', overflow:'hidden', borderLeft:'0.5px solid rgba(255,255,255,0.04)', background:'rgba(0,0,0,0.12)' }}>
          {/* tabs */}
          <div style={{ padding:'7px 10px 6px', borderBottom:'0.5px solid rgba(255,255,255,0.035)', display:'flex', alignItems:'center', gap:3, flexShrink:0 }}>
            <button className={`tab${tab==='preview'?' on':''}`} onClick={() => setTab('preview')}>Vista Previa</button>
            <button className={`tab${tab==='text'?' on':''}`}    onClick={() => setTab('text')}>Texto</button>
          </div>

          {tab==='preview' ? (
            <div style={{ flex:1, padding:12, display:'flex', flexDirection:'column', gap:8, overflow:'hidden' }}>
              {/* PDF viewer — fills available space */}
              <div style={{ flex:1, position:'relative', minHeight:0 }}>
                <Thumbnail file={sel} />
              </div>
              {/* Page nav below */}
              {sel && (
                <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:5, flexShrink:0 }}>
                  <button className="pg-btn" onClick={() => setPg(p=>Math.max(1,p-1))}>‹</button>
                  <span style={{ fontSize:10, color:'rgba(145,158,195,0.38)', minWidth:52, textAlign:'center', fontVariantNumeric:'tabular-nums' }}>pág. {pg} / 3</span>
                  <button className="pg-btn" onClick={() => setPg(p=>Math.min(3,p+1))}>›</button>
                </div>
              )}
              {sel && (
                <div style={{ fontSize:9, color:'rgba(145,158,195,0.2)', textAlign:'center', fontFamily:'Roboto Mono,monospace', letterSpacing:'0.02em', flexShrink:0 }}>{sel.orig}</div>
              )}
            </div>
          ) : (
            <div style={{ flex:1, display:'flex', flexDirection:'column', padding:12, gap:6, overflow:'hidden' }}>
              <span className="mlabel">Texto extraído · pág. 1</span>
              <textarea className="txtarea" value={sel ? TEXTS[sel.ti] : 'Sin texto'} onChange={()=>{}} />
            </div>
          )}
        </div>

        {/* R drag (resize right panel from left edge) */}
        <div className="div-h" style={{ order:-1 }} onMouseDown={() => { dragR.current = true; }} />
      </div>

      {/* CONSOLE */}
      {tw.showConsole && (
        <>
          <div className="div-v" onMouseDown={() => { dragV.current = true; }} />
          <div style={{ height:logH, flexShrink:0, display:'flex', flexDirection:'column', overflow:'hidden', background:'rgba(0,0,0,0.22)', borderTop:'0.5px solid rgba(255,255,255,0.035)' }}>
            <div style={{ padding:'4px 14px', borderBottom:'0.5px solid rgba(255,255,255,0.028)', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
              <span className="mlabel">Consola</span>
              <button onClick={()=>setLogs(LOG0)} style={{ background:'transparent', border:'none', color:'rgba(145,158,195,0.28)', fontSize:10, cursor:'pointer', fontFamily:'Roboto,sans-serif', letterSpacing:'0.04em', transition:'color 0.15s' }}
                onMouseEnter={e=>e.target.style.color='rgba(195,208,238,0.58)'}
                onMouseLeave={e=>e.target.style.color='rgba(145,158,195,0.28)'}
              >Limpiar</button>
            </div>
            <Console logs={logs} />
          </div>
        </>
      )}

      {/* STATUS BAR */}
      <div className="sbar">
        <div className="sbar-dot" />
        <span className="sbar-txt">{hasFiles ? `${total} PDFs en cola · ${saved} guardados` : 'Sin archivos en cola'}</span>
        <div style={{ flex:1 }} />
        {sel && <span className="sbar-txt" style={{ fontFamily:'Roboto Mono,monospace' }}>{sel.orig}</span>}
        <div style={{ width:'0.5px', height:11, background:'rgba(255,255,255,0.06)' }} />
        <span className="sbar-txt">modo: renombrar</span>
      </div>

      {/* TWEAKS */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Interfaz" />
        <TweakToggle label="Mostrar consola" value={tw.showConsole} onChange={v=>setTweak('showConsole',v)} />
        <TweakRadio  label="Densidad" value={tw.density} options={['compact','normal','relaxed']} onChange={v=>setTweak('density',v)} />
      </TweaksPanel>

      {/* LOADING OVERLAY */}
      {loading && <LoadingOverlay files={INIT_FILES} onDone={onLoadDone} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
